name: Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  linux:
    name: Linux

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNANE_ENABLE_OPENMP=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install ninja

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNANE_ENABLE_OPENMP=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -DNANE_ENABLE_OPENMP=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
