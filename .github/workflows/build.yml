name: Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  linux:
    name: Linux

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libvtk9-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

  macos:
    name: macOS

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install vtk ninja

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNANE_ENABLE_OPENMP=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix vtk)"

      - name: Build
        run: cmake --build build --parallel

  windows:
    name: Windows

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install VTK
        shell: pwsh
        run: |
          vcpkg install "vtk[core,opengl]:x64-windows"

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
